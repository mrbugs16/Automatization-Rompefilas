[pytest]
testpaths = tests
pythonpath = .
addopts = -v -s -p no:cacheprovider
markers =
    caso(id, **meta): vincula la prueba con un caso de la matriz (CP-XX-ROM-xxx)
    lento: espera a propósito más de un minuto (inactividad, timeout de tarjeta)
    red: corta Wi-Fi y datos móviles de la T6 durante la prueba
    reinicio: reinicia la T6 (solo con --incluir-reinicio)
    tarjeta: requiere el módulo de pago de la T6
    pinpad: valida las pantallas del pinpad real (tarjeta / NIP); es lo que corre --solo-tarjeta
    msi: pago a 6 meses sin intereses (transacciones desde $1,000; validación manual)
